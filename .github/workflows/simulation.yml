name: SystemVerilog simulation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  simulation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y iverilog verilator
      - run: make test
      - run: make lint
      - run: make test-verilator
